name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*' # Triggers a release when you push a tag like v1.0.0
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Publish
      run: dotnet publish --no-build -c Release -o ./publish

    - name: Package Plugin
      run: |
        # Create the standard CounterStrikeSharp folder structure for distribution
        mkdir -p release/Cs2Casino
        cp publish/Cs2Casino.dll release/Cs2Casino/
        cp publish/Cs2Casino.pdb release/Cs2Casino/ || true
        
        # Zip it up
        cd release
        zip -r ../Cs2Casino.zip Cs2Casino

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cs2Casino-Build
        path: Cs2Casino.zip

    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: Cs2Casino.zip
        generate_release_notes: true
